name: WorkBuddy Cloud Checkin

on:
  schedule:
    # 北京时间 09:17，避开整点。GitHub 调度可能延迟。
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      check_only:
        description: '仅查询签到状态（仍会刷新并保存授权）'
        type: boolean
        default: true

concurrency:
  group: workbuddy-cloud-session
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  checkin:
    if: github.ref_name == github.event.repository.default_branch && (vars.WB_SIGNIN_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.check_only))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-actions.txt
      - name: Refresh session and check in
        env:
          GH_TOKEN: ${{ github.token }}
          WB_AUTH_JSON: ${{ secrets.WB_AUTH_JSON }}
          WB_STATE_KEY: ${{ secrets.WB_STATE_KEY }}
          CHECK_ONLY: ${{ inputs.check_only }}
          TZ: Asia/Shanghai
        run: |
          if [ "$CHECK_ONLY" = 'true' ]; then
            python -B cloud_signin.py --check-only
          else
            python -B cloud_signin.py
          fi
